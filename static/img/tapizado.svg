<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    Tapizado estilo casas antiguas: damasco beige con grano de felpa.
    Losa seamless de 400x400 con motivo en repeticion al tresbolis
    (motivo central + cuatro cuartos en las esquinas) para que el
    patron empalme perfecto al repetirse como background.
    Se usa como fondo de la seccion "la pared".
  -->
  <defs>
    <linearGradient id="vaina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c8a4"/>
      <stop offset=".5" stop-color="#c3ad82"/>
      <stop offset="1" stop-color="#d9c8a4"/>
    </linearGradient>

    <!-- Motivo damasco: palmeta central con volutas, simetrico -->
    <g id="motivo">
      <path fill="url(#vaina)" d="M0,-64 C15,-44 17,-16 0,10 C-17,-16 -15,-44 0,-64 Z"/>
      <path fill="#b49c6e" d="M0,-56 C11,-40 12,-18 0,2 C-12,-18 -11,-40 0,-56 Z" opacity=".45"/>
      <path fill="url(#vaina)" d="M-34,-30 C-52,-24 -58,-6 -46,14 C-36,28 -14,32 -2,22 C-20,20 -34,10 -38,-4 C-41,-16 -39,-25 -34,-30 Z"/>
      <path fill="url(#vaina)" d="M34,-30 C52,-24 58,-6 46,14 C36,28 14,32 2,22 C20,20 34,10 38,-4 C41,-16 39,-25 34,-30 Z"/>
      <path fill="url(#vaina)" d="M-26,26 C-38,34 -40,50 -28,60 C-18,68 -4,66 2,58 C-10,60 -20,54 -23,44 C-25,37 -25,31 -26,26 Z"/>
      <path fill="url(#vaina)" d="M26,26 C38,34 40,50 28,60 C18,68 4,66 -2,58 C10,60 20,54 23,44 C25,37 25,31 26,26 Z"/>
      <circle cx="0" cy="-72" r="5" fill="#c9b487"/>
      <circle cx="0" cy="-72" r="2.2" fill="#efe6cf"/>
      <circle cx="-46" cy="-8" r="3.4" fill="#c9b487"/>
      <circle cx="46" cy="-8" r="3.4" fill="#c9b487"/>
      <path fill="#bfa87c" d="M-8,-14 C-4,-8 4,-8 8,-14 C5,-4 -5,-4 -8,-14 Z"/>
      <path stroke="#b49c6e" stroke-width="1.4" fill="none" opacity=".6"
            d="M-30,-42 C-38,-34 -40,-24 -36,-16 M30,-42 C38,-34 40,-24 36,-16"/>
    </g>

    <!-- Grano de felpa: ruido suave color fibra -->
    <filter id="felpa" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="11" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix"
        values="0 0 0 0 0.38
                0 0 0 0 0.29
                0 0 0 0 0.15
                0.5 0 0 0 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Base beige calido -->
  <rect width="400" height="400" fill="#e9ddc4"/>

  <!-- Franjas verticales apenas mas oscuras (paneles del tapizado) -->
  <rect x="0"   width="100" height="400" fill="#7a5c28" opacity=".035"/>
  <rect x="200" width="100" height="400" fill="#7a5c28" opacity=".035"/>

  <!-- Repeticion al tresbolis: motivo central + cuartos en esquinas -->
  <use href="#motivo" transform="translate(200 200)"/>
  <use href="#motivo" transform="translate(0 0)"/>
  <use href="#motivo" transform="translate(400 0)"/>
  <use href="#motivo" transform="translate(0 400)"/>
  <use href="#motivo" transform="translate(400 400)"/>

  <!-- Puntitos dorados apagados entre motivos -->
  <g fill="#b89c62" opacity=".5">
    <circle cx="100" cy="100" r="1.6"/><circle cx="300" cy="100" r="1.6"/>
    <circle cx="100" cy="300" r="1.6"/><circle cx="300" cy="300" r="1.6"/>
    <circle cx="200" cy="60"  r="1.3"/><circle cx="60"  cy="200" r="1.3"/>
    <circle cx="340" cy="200" r="1.3"/><circle cx="200" cy="340" r="1.3"/>
  </g>

  <!-- Velo de felpa encima de todo -->
  <rect width="400" height="400" filter="url(#felpa)" opacity=".5"/>
</svg>
